spring:
  application:
    name: core-api
  profiles:
    default: demo
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/postgresql
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Used only when AUTH_MODE=entra (demo mode registers its own HS256 decoder).
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:not-configured}/v2.0
          audiences: ${ENTRA_AUDIENCE:}
  ai:
    # spring.ai.model.chat is derived from LLM_PROVIDER by LlmProviderEnvironmentPostProcessor.
    model:
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    chat:
      client:
        enabled: false   # ChatClient is built in OrderSummaryService only when a ChatModel exists
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${CLAUDE_MODEL:claude-sonnet-5-5}
          max-tokens: 400
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT:}
        api-key: ${AZURE_OPENAI_API_KEY:}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}
            max-tokens: 400

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework   # Render / Container Apps terminate TLS in front of us

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        name: core-api

app:
  auth:
    mode: ${AUTH_MODE:demo}
    jwt-secret: ${JWT_SECRET:orderpilot-dev-secret-change-me-please-32b}
    demo-issuer: orderpilot-demo
    token-ttl: 8h
    entra:
      tenant-id: ${ENTRA_TENANT_ID:}
      audience: ${ENTRA_AUDIENCE:}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}
  ai:
    provider: ${LLM_PROVIDER:mock}
  business:
    timezone: Asia/Dubai
    low-stock-threshold: 50
    currency: AED

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:orderpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orderpilot}   # JDBC form
    username: ${DB_USER:orderpilot}
    password: ${DB_PASSWORD:orderpilot}
    hikari:
      maximum-pool-size: 5

---
spring:
  config:
    activate:
      on-profile: azure
  datasource:
    # e.g. jdbc:sqlserver://<server>.database.windows.net:1433;database=orderpilot;encrypt=true;loginTimeout=30
    url: ${AZURE_SQL_URL}
    username: ${AZURE_SQL_USER}
    # Never put this in config: in Azure Container Apps it is a secret that references Azure Key Vault
    # (secretRef -> keyvaultref:<vault-uri>/secrets/sql-password, read via the app's managed identity).
    password: ${AZURE_SQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration/sqlserver
  jpa:
    properties:
      hibernate:
        use_nationalized_character_data: true
