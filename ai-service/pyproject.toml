[project]
name = "orderpilot-ai-service"
version = "0.1.0"
description = "OrderPilot AI microservice: LangGraph agent, knowledge search, Prompt Studio"
requires-python = ">=3.12"
# Kept in sync with requirements.txt (Vercel installs from here, Docker/CI from requirements.txt).
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "anthropic==2.4.0",
    "openai==3.42.1",
    "langgraph==1.2.19",
    "rank-bm25==0.2.2",
    "azure-search-documents==12.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"app/agent/prompts.py" = ["E501"]
